<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d94f4"/>
      <stop offset="100%" stop-color="#6b73ec"/>
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#8d94f4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8d94f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="86%" cy="82%" r="55%">
      <stop offset="0%" stop-color="#e6b877" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e6b877" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1d28" stroke-width="1"/>
    </pattern>
    <mask id="gridMask">
      <rect width="1200" height="320" fill="white"/>
      <rect width="1200" height="320" fill="url(#fade)"/>
    </mask>
    <radialGradient id="fade" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0b0d13"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow1)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow2)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#1f2330" stroke-width="1.5"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="150" font-size="78" font-weight="700" fill="#e7e9ee" letter-spacing="-2">PHP <tspan fill="url(#titleGrad)">MVC</tspan></text>

    <g transform="translate(80,178)">
      <rect x="0" y="0" width="92" height="28" rx="14" fill="#11141c" stroke="#1f2330"/>
      <circle cx="16" cy="14" r="3.5" fill="#e6b877"/>
      <text x="28" y="19" font-family="'Consolas','JetBrains Mono',monospace" font-size="13" fill="#8d94f4">v1.0.0</text>
    </g>

    <text x="80" y="238" font-size="19" fill="#8891a5">A plain-PHP MVC framework built to teach how frameworks actually work.</text>
    <text x="80" y="266" font-size="14" font-family="'Consolas','JetBrains Mono',monospace" fill="#575f72">Container &#183; Router &#183; Model &#183; View &#183; Migrations &mdash; zero dependencies</text>
  </g>

  <g transform="translate(860,60)" font-family="'Consolas','JetBrains Mono',monospace">
    <rect width="260" height="200" rx="10" fill="#0f1119" stroke="#1f2330"/>
    <rect width="260" height="34" rx="10" fill="#11141c"/>
    <rect width="260" height="17" y="17" fill="#11141c"/>
    <circle cx="20" cy="17" r="4.5" fill="#242838"/>
    <circle cx="35" cy="17" r="4.5" fill="#242838"/>
    <circle cx="50" cy="17" r="4.5" fill="#242838"/>
    <text x="18" y="60" font-size="12" fill="#8d94f4">Route<tspan fill="#e7e9ee">::</tspan>get(<tspan fill="#9fd6a0">'/'</tspan>,</text>
    <text x="30" y="80" font-size="12" fill="#e7e9ee">[HomeController<tspan fill="#e7e9ee">::</tspan>class,</text>
    <text x="30" y="100" font-size="12" fill="#9fd6a0">'index'])<tspan fill="#e7e9ee">;</tspan></text>
    <text x="18" y="130" font-size="12" fill="#575f72">// Container auto-wires</text>
    <text x="18" y="148" font-size="12" fill="#575f72">// every dependency</text>
    <rect x="18" y="168" width="7" height="14" fill="#8d94f4"/>
  </g>
</svg>
